<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hafalanku Ga Mutqin.</title>
    <style>
        /* --- VARIABEL WARNA (LIGHT & DARK MODE) --- */
        :root {
            --bg-color: #f4f4f0;       /* Light default: kertas arsip lawas */
            --text-color: #111111;
            --panel-bg: #e2e2dc;
            --panel-border: #999;
        }

        [data-theme="dark"] {
            --bg-color: #0b0b0b;       /* Dark mode */
            --text-color: #eeeeee;
            --panel-bg: #1a1a1a;
            --panel-border: #444;
        }

        * {
            box-sizing: border-box;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            /* font-family: monospace; */
            font-family: 'Lato', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            margin: 0;
            padding-top: 65px; /* Biar konten gak ketutupan panel fixed di atas */
        }

        /* --- 1. PANEL TUA FIXED DI ATAS --- */
        .top-panel {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: var(--panel-bg);
            border-bottom: 2px solid var(--panel-border);
            padding: 8px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            font-size: 0.85rem;
        }

        /* POSISI KIRI: Arsip Abdillah & Menu */
        .panel-left {
            text-align: left;
        }

        .site-title-mini {
            font-weight: bold;
            letter-spacing: 1px;
            font-size: 25px;
        }

        .nav-links {
            font-size: 0.75rem;
            margin-top: 5px;
        }

        .nav-links a {
            color: var(--text-color);
            text-decoration: none;
            margin-right: 5px;
        }
        .nav-links a:hover {
            text-decoration: underline;
        }

        /* POSISI KANAN: Theme Switcher Sliding Hijau */
        .panel-right {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .switch-container {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.7rem;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 42px;
            height: 22px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc;
            transition: .3s;
            border-radius: 20px; /* Kapsul halus modern */
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #2ecc71; /* WARNA IJO PAS AKTIF */
        }

        input:checked + .slider:before {
            transform: translateX(20px);
        }


        /* --- 2. WRAPPER UTAMA (MAX-WIDTH 850px, MARGIN 0 AUTO) --- */
        .web-wrapper {
            max-width: 850px;
            margin: 0 auto;
        }

        /* --- 3. HERO SECTION (30vh) --- */
        .hero-section {
            height: 30vh;
            min-height: 180px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 20px;
            border-bottom: 2px dashed var(--panel-border);
            margin-bottom: 0px;
        }

        .hero-section h1 {
            font-size: 3rem;
            margin: 0 0 5px 0;
            letter-spacing: -1px;
        }

        .hero-section p {
            font-size: 0.85rem;
            opacity: 0.7;
            margin: 0;
        }

        /* Khusus pas dibuka di HP, dikecilin dikit biar nggak kepanjangan */
        @media (max-width: 600px) {
            .hero-section h1 {
                font-size: 2.2rem; /* Pas di layar HP, tegas dan gak lebay */
            }
        }


        /* --- 4. GRID ASIMETRIS (GAP 0, UKURAN 1x1, 2x2, 3x1) --- */
        .grid-asimetris {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-auto-rows: 180px;
            gap: 0; /* TANPA JARAK SAMA SEKALI */
        }

        .item-1x1 { grid-column: span 1; grid-row: span 1; }
        .item-2x2 { grid-column: span 2; grid-row: span 2; }
        .item-3x1 { grid-column: span 3; grid-row: span 1; }

        .grid-asimetris div img, 
        .grid-asimetris div svg {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }


        /* --- RESPONSIF HP --- */
        @media (max-width: 600px) {
            .grid-asimetris {
                grid-template-columns: 1fr;
                grid-auto-rows: auto;
            }
            .item-1x1, .item-2x2, .item-3x1 {
                grid-column: span 1 !important;
                grid-row: span 1 !important;
                aspect-ratio: 1 / 1 !important;
            }
            .item-3x1 {
                aspect-ratio: 3 / 1 !important;
            }
            .top-panel {
                padding: 6px 10px;
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body data-theme="light"> <!-- Default light, diatur JS buat simpen status terakhir -->

    <!-- PANEL TUA FIXED DI ATAS -->
    <div class="top-panel">
        <!-- KIRI: # Arsip Abdillah & Menu (Home, Help, Donate) -->
        <div class="panel-left">
            <div class="site-title-mini"># Arsip Abdillah</div>
            <div class="nav-links">
                <a href="#">Home</a> | 
                <a href="#help">[Help]</a> | 
                <a href="#donate" style="color: #27ae60; font-weight: bold;">Donate</a>
            </div>
        </div>

        <!-- KANAN: Theme Switcher Sliding Hijau -->
        <div class="panel-right">
            <div class="switch-container">
                <span id="themeLabel">IRENG / DARK WEB</span>
                <label class="switch">
                    <input type="checkbox" id="themeToggle">
                    <span class="slider"></span>
                </label>
            </div>
        </div>
    </div>


    <div class="web-wrapper">

        <!-- HERO SECTION 30vh -->
        <section class="hero-section">
            <h1>Hafalanku Ga Mutqin</h1>
            <p>~ Proyek Open-Source Mustasyabihat Compiler & Catatan Harian ~</p>
        </section>


        <!-- GRID TIDAK BERATURAN (GAP 0) -->
        <div class="grid-asimetris">
            
            <!-- Kotak Melebar 3x1 -->
            <div class="item-3x1">
                <img src="banner-top.jpg" alt="Banner Utama">       <!-- ISI GAMBAR: ilsutrasi dan tulisan "Setelah mondok, aku hafalannya berantakan." -->
            </div>

            <!-- Kotak 1x1 -->
            <div class="item-1x1">
                <img src="kotak-solusi-1.jpg" alt="Solusi 1">       <!-- ISI GAMBAR: ilsutrasi dan tulisan "Solusi Pertama: Fundamental Murojaah." -->
            </div>

            <!-- Kotak Besar 2x2 -->
            <div class="item-2x2">
                <img src="kotak-compiler-v0.01.png" alt="Mustasyabihat Compiler v0.01">         <!-- ISI GAMBAR: ilsutrasi dan tulisan "Download Our App! Mutasyabihat Compiler v0.01." -->
            </div>

            <!-- Kotak 1x1 -->
            <div class="item-1x1">
                <img src="kotak-arsip-2.jpg" alt="Arsip 2">         <!-- ISI GAMBAR: ilsutrasi dan tulisan "Musuh Tersadis" -->
            </div>

            <!-- Kotak 1x3 (Melar mentok kanan) -->
            <div style="grid-column: span 3;">
                <img src="kotak-arsip-3.png" alt="Arsip 3">         <!-- ISI GAMBAR: ilsutrasi dan tulisan "Solusi Kedua: Mengasah Endurance." -->
            </div>

            <style>
                img {cursor: pointer; transition: all 0.1s ease;}
                img:hover {border: 2px solid dodgerblue;}
            </style>

            <style>
            /* 1. Pastikan gambar di dalam grid TIDAK BAKAL BABLAS keluar */
            .grid-asimetris img {
                width: 100%;
                height: 100%;
                object-fit: cover; /* Biar gambar pas nge-crop di dalam kotak tanpa gepeng */
                display: block;
                cursor: pointer; 
                transition: all 0.1s ease;
            }
            
            .grid-asimetris img:hover {
                border: 2px solid dodgerblue;
            }

            /* 2. KHUSUS RESPONSIF HP (Layar di bawah 600px) */
            @media (max-width: 600px) {
                .grid-asimetris {
                    grid-template-columns: 1fr; /* Jadi 1 kolom lurus ke bawah */
                    grid-auto-rows: auto;
                }

                /* Semua kotak di HP dipaksa jadi kotak persegi (1:1) yang rapi */
                .grid-asimetris > div {
                    grid-column: span 1 !important; /* Paksa balik jadi 1 kolom */
                    grid-row: span 1 !important;
                    aspect-ratio: 1 / 1; /* Bikin bentuknya tetap kotak sempurna di HP */
                    width: 100%;
                }

                /* Kecuali kalau emang mau banner atas atau arsip 3 bentuknya melebar (misal 3:1) */
                .item-3x1, 
                .grid-asimetris > div:has(img[alt="Arsip 3"]) {
                    aspect-ratio: 3 / 1 !important; /* Tetap melebar tapi aman di HP */
                }

                .grid-asimetris {
                    margin: 40px;
                }
            }
        </style>

        </div>

    </div>

    <!-- SCRIPT THEME SWITCHER -->
    <script>
        const toggleSwitch = document.getElementById('themeToggle');
        const currentTheme = localStorage.getItem('theme') || 'light';

        // Set kondisi awal sesuai memori terakhir user
        if (currentTheme === 'dark') {
            document.body.setAttribute('data-theme', 'dark');
            toggleSwitch.checked = true;
        } else {
            document.body.setAttribute('data-theme', 'light');
            toggleSwitch.checked = false;
        }

        // Fungsi waktu switch digeser
        toggleSwitch.addEventListener('change', function(e) {
            if (e.target.checked) {
                document.body.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
            } else {
                document.body.setAttribute('data-theme', 'light');
                localStorage.setItem('theme', 'light');
            }
        });
    </script>

</body>
</html>
